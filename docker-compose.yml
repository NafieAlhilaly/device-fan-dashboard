version: '3.2'
services:
  app:
    build: .
    container_name: app
    ports:
      - '8081:80'
    env_file:
      - .env
    depends_on:
      - db
  db:
    image: mysql:8.0
    container_name: db
    restart: always
    env_file:
      - .env
    ports:
      - 3306:3306
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin
    ports:
      - '8082:80'